name: CI

# Corre en cada pull request y en cada push a main (RNF-17, DoD: «el CI está en verde»).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · lint, formato, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valores de relleno: el build solo necesita que existan. Los reales los pone
          # Cloudflare Pages (Production y Preview).
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  funciones:
    name: Edge Functions · revisión estática
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # En los equipos no hay Deno ni Docker: esta es la única revisión estática de lo que
      # solo corre en Deno. La lógica se prueba con Vitest, en el trabajo «App» (ADR 0012).
      - uses: denoland/setup-deno@v2
        with:
          # La misma versión mayor que [edge_runtime] deno_version de supabase/config.toml.
          deno-version: v2.x

      - name: Revisar la entrada de cada función con su deno.json
        run: |
          for carpeta in supabase/functions/*/; do
            case "$(basename "$carpeta")" in _*) continue ;; esac
            deno check --config "${carpeta}deno.json" "${carpeta}index.ts"
          done

  bd:
    name: Base de datos · migraciones y pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          # La misma versión que la dependencia `supabase` de package.json.
          version: 2.120.0

      - name: Levantar Supabase local (aplica todas las migraciones y el seed)
        run: supabase start

      - name: Pruebas de base de datos (pgTAP)
        run: supabase test db

  e2e:
    name: Extremo a extremo · Chromium y WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Los equipos no abren WebKit (decisiones-pendientes, punto 15): aquí se prueba Safari
    # (RNF-04). Bloquea desde el Sprint 5 (plan, decisión 8): la primera semana corrió sin
    # bloquear y nunca falló en main.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar Supabase local (migraciones y seed)
        run: supabase start

      # La contraseña nace aquí, al azar, y no sale del trabajo: el repositorio es público.
      - name: Contraseña de los usuarios de prueba y variables de la app
        run: |
          eval "$(supabase status -o env)"
          clave="$(openssl rand -hex 16)"
          echo "::add-mask::$clave"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            # La clave pública del ejemplo del RFC 8291: sin ella la app no ofrece 10-B. La e2e
            # de CU-31 simula el servicio push; no se envía nada.
            echo "VITE_VAPID_PUBLIC_KEY=BP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A8"
            echo "CLAVE_USUARIOS_DE_PRUEBA=$clave"
          } >> "$GITHUB_ENV"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v clave="$clave" <<'SQL'
          update auth.users
             set encrypted_password = extensions.crypt(:'clave', extensions.gen_salt('bf'))
           where email like '%@novedades.test';
          SQL

      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit

      # Sin artefactos: test-results/ guarda lo escrito en los campos, contraseña incluida.
      - name: Pruebas de extremo a extremo
        run: npm run test:e2e
